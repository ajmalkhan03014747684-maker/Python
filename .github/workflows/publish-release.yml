name: publish-release

# Builds the signed APK for your website and the OPPO store, then publishes it as a GitHub Release
# in THIS repository. Run: Actions -> publish-release -> Run workflow (you can leave every box empty).
# Version numbers count up by themselves (0.1.1, 0.1.2 ...). Type your own only if you want to.
#
# It REFUSES to run without your permanent signing key (secret PY3X_KEYSTORE_B64), so a temporary-key
# file can never reach your users or a store.
#
# Release downloads are public only if this repository is public. In a private repository the files are
# still published as a release, but only you can download them, so the website link will not work.
# Optional: to publish to a different repository set variable PY3X_RELEASES_REPO and secret PY3X_RELEASE_TOKEN.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name like 1.2.3 (leave empty for automatic)"
        required: false
        default: ""
      version_code:
        description: "Whole number higher than the last release (leave empty for automatic)"
        required: false
        default: ""
      notes:
        description: "What changed (shown on the release page)"
        required: false
        default: ""

jobs:
  release:
    name: "Release build"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ORG_GRADLE_PROJECT_py3xPackages: "numpy,pandas,matplotlib,pillow,pyyaml,lxml,sympy,beautifulsoup4,jinja2,rich,tqdm,click"
      ORG_GRADLE_PROJECT_py3xPacksPackages: "numpy,pandas,matplotlib,pillow,pyyaml,scipy,scikit-learn,opencv-python,sympy,beautifulsoup4,jinja2,rich,tqdm,click,${{ vars.PY3X_PACKS_EXTRA || 'scikit-image,statsmodels' }}"
      ORG_GRADLE_PROJECT_py3xVersionName: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
      ORG_GRADLE_PROJECT_py3xVersionCode: ${{ inputs.version_code || github.run_number }}
      # Default: publish in this repository with the built-in token. Optional override below.
      RELEASES_REPO: ${{ vars.PY3X_RELEASES_REPO || github.repository }}
      RELEASE_TOKEN: ${{ secrets.PY3X_RELEASE_TOKEN || github.token }}
    steps:
      - name: "Check the inputs and the signing key"
        env:
          KS: ${{ secrets.PY3X_KEYSTORE_B64 }}
          VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
          CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 1.2.3"; exit 1; }
          echo "$CODE" | grep -Eq '^[1-9][0-9]{0,8}$' || { echo "::error::Version code must be a whole number such as 1, 2, 3"; exit 1; }
          [ -n "$KS" ] || { echo "::error::Secret PY3X_KEYSTORE_B64 is missing. Run make-signing-key once and add the secret. Refusing to publish a temporary-key build."; exit 1; }

      - name: "Checkout repository"
        uses: actions/checkout@v4

      # Public settings come from the file py3x-config.env in the repo (edit it right in GitHub).
      # A repository variable with the same purpose, if you set one, wins over the file.
      - name: "Load public settings from py3x-config.env"
        env:
          V_URL: ${{ vars.PY3X_SUPABASE_URL }}
          V_KEY: ${{ vars.PY3X_SUPABASE_ANON_KEY }}
          V_ADMOB: ${{ vars.PY3X_ADMOB_APP_ID }}
        run: |
          get() { grep -E "^$1=" py3x-config.env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '\r"' | xargs || true; }
          URL="${V_URL:-$(get SUPABASE_URL)}"; KEY="${V_KEY:-$(get SUPABASE_ANON_KEY)}"; ADMOB="${V_ADMOB:-$(get ADMOB_APP_ID)}"
          ok() { [ -z "$2" ] && return 0; echo "$2" | grep -Eq "$1" && return 0; echo "::warning::Ignoring a setting that does not look right: $3"; return 1; }
          ok '^https://[a-z0-9-]+\.supabase\.(co|in)$' "$URL" SUPABASE_URL || URL=""
          ok '^[A-Za-z0-9._-]+$' "$KEY" SUPABASE_ANON_KEY || KEY=""
          # Not set anywhere above? Use the App ID typed into the admin panel (Ad Networks -> AdMob), read from your backend.
          if [ -z "$ADMOB" ] && [ -n "$URL" ] && [ -n "$KEY" ]; then
            ADMOB=$(curl -fsS --max-time 20 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$URL/rest/v1/app_settings?key=eq.ads&select=value" 2>/dev/null | jq -r '.[0].value.admob_app_id // empty' 2>/dev/null || true)
            [ -n "$ADMOB" ] && echo "AdMob app id taken from the admin panel."
          fi
          ok '^ca-app-pub-[0-9]{16}~[0-9]{10}$' "$ADMOB" ADMOB_APP_ID || ADMOB=""
          echo "ORG_GRADLE_PROJECT_py3xSupabaseUrl=$URL" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_py3xSupabaseAnonKey=$KEY" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_py3xAdmobAppId=$ADMOB" >> "$GITHUB_ENV"
          [ -n "$URL" ] && echo "Online backend: ON" || echo "Online backend: not configured (the app works offline)"
          [ -n "$ADMOB" ] && echo "AdMob app id: set" || echo "AdMob app id: not set (Google test ads only)"

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.10

      - name: "Unpack project"
        run: unzip -q python-3x-android-ide.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Accept Android SDK licenses"
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: "Install the permanent signing key"
        env:
          KS: ${{ secrets.PY3X_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | tr -d '\r' | grep -Eo '[A-Za-z0-9+/=]{200,}' | head -1 | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null || { echo "::error::The signing key secret could not be read."; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: "Build the Packs app"
        run: cd python-3x-android-ide/android && gradle --no-daemon :packs:assembleFast

      - name: "Embed Packs in the IDE"
        run: |
          cd python-3x-android-ide/android
          mkdir -p app/src/main/assets/packs
          cp packs/build/outputs/apk/fast/*.apk app/src/main/assets/packs/python3x-packs.apk

      - name: "Build the IDE"
        run: cd python-3x-android-ide/android && gradle --no-daemon :app:assembleFast

      - name: "Collect, verify and fingerprint"
        id: files
        run: |
          mkdir -p out
          cp python-3x-android-ide/android/app/build/outputs/apk/fast/*.apk out/Python-3x.apk
          cp python-3x-android-ide/android/packs/build/outputs/apk/fast/*.apk out/Python-3x-Packs.apk
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          for f in out/Python-3x.apk out/Python-3x-Packs.apk; do
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$f" | head -3
          done
          A=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs out/Python-3x.apk | grep -m1 'SHA-256 digest')
          B=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs out/Python-3x-Packs.apk | grep -m1 'SHA-256 digest')
          [ "$A" = "$B" ] || { echo "::error::The two apps are signed with different keys."; exit 1; }
          SHA=$(sha256sum out/Python-3x.apk | cut -d' ' -f1)
          SIZE=$(( ( $(stat -c%s out/Python-3x.apk) + 1048575 ) / 1048576 ))
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "$SHA  Python-3x.apk" > out/Python-3x.apk.sha256
          ls -l out

      - name: "Publish the GitHub Release"
        id: publish
        env:
          VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
          NOTES: ${{ inputs.notes }}
          SHA: ${{ steps.files.outputs.sha }}
        run: |
          if [ -z "$RELEASES_REPO" ] || [ -z "$RELEASE_TOKEN" ]; then
            echo "published=no" >> "$GITHUB_OUTPUT"
            echo "PY3X_RELEASES_REPO or PY3X_RELEASE_TOKEN is not set, so the files are kept on this run instead."
            exit 0
          fi
          export GH_TOKEN="$RELEASE_TOKEN"
          printf '%s\n\nSHA-256 of Python-3x.apk:\n%s\n' "${NOTES:-Release $VERSION}" "$SHA" > notes.txt
          if gh release create "v$VERSION" out/Python-3x.apk out/Python-3x-Packs.apk out/Python-3x.apk.sha256 \
               --repo "$RELEASES_REPO" --title "Python 3.x $VERSION" --notes-file notes.txt --latest; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not create the release (is the version already used?). The files are kept on this run instead."
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      - name: "Keep the files on this run if nothing was published"
        if: steps.publish.outputs.published != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: python-3x-release-${{ inputs.version || format('0.1.{0}', github.run_number) }}
          path: out/
          retention-days: 7
          compression-level: 0

      - name: "What to do next"
        env:
          VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
          SHA: ${{ steps.files.outputs.sha }}
          SIZE: ${{ steps.files.outputs.size }}
        run: |
          {
            echo "## Python 3.x $VERSION built and signed with your permanent key"
            echo
            echo "SHA-256: \`$SHA\`  Size: about $SIZE MB"
            echo
            echo "### Website"
            echo "Nothing to do. The site reads the latest release by itself (set githubRepo once in release.json)."
            echo "Download link: https://github.com/$RELEASES_REPO/releases/latest/download/Python-3x.apk"
            echo
            echo "### OPPO App Market: upload the same Python-3x.apk (version code ${{ inputs.version_code || github.run_number }})."
            echo "Use the same file on both so the checksums and signatures match."
          } >> "$GITHUB_STEP_SUMMARY"
